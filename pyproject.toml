[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "staledep"
version = "0.1.0"
description = "Detect time-of-check-to-time-of-use windows in LLM agent trajectories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "agents", "security", "toctou", "mcp", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# Only needed to reproduce the measurements over AgentDojo runs.
bench = ["agentdojo"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["staledep"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The report scripts print aligned tables. Percent formatting keeps column
# widths legible next to the format string; f-strings do not.
"report_*.py" = ["UP031"]
"measure_*.py" = ["UP031"]
"label_*.py" = ["UP031"]
"audit_*.py" = ["UP031"]
"probe_*.py" = ["UP031"]
"run_*.py" = ["UP031"]
